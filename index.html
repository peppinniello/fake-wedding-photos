<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Fake Wedding — Photo & Video Drop</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #FAF7F2; color: #1F2937; -webkit-tap-highlight-color: transparent; }
    .serif { font-family: 'Cormorant Garamond', serif; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <header class="w-full px-5 py-4 flex items-center justify-between border-b border-stone-200/80 bg-[#FAF7F2]/90 backdrop-blur sticky top-0 z-20">
    <div>
      <span class="text-[11px] uppercase tracking-[0.2em] text-amber-800 font-semibold block">Kasernen • Falun</span>
      <h1 class="serif text-2xl font-bold text-stone-900 leading-none">Fake Wedding</h1>
    </div>
    <button type="button" onclick="openQrModal()" class="flex items-center gap-1.5 text-xs font-semibold bg-stone-900 text-white px-3.5 py-2 rounded-full shadow-sm active:scale-95 transition">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 00-1 1v2a1 1 001 1z"></path></svg>
      Event QR
    </button>
  </header>

  <main class="flex-1 max-w-md w-full mx-auto px-5 py-6 flex flex-col justify-between">
    <div>
      <div class="text-center mb-6">
        <p class="serif italic text-3xl text-stone-800 mb-1">Capture the Chaos</p>
        <p class="text-sm text-stone-500">Drop your photos directly below, or upload short videos (max 1 min) to the video folder.</p>
      </div>

      <div class="mb-4">
        <label class="block text-xs font-semibold uppercase tracking-wider text-stone-500 mb-1.5">Your Name or Role (optional)</label>
        <input id="guestName" type="text" placeholder="e.g. Secret Lover, Best Man, Luca..." class="w-full px-4 py-3 rounded-xl bg-white border border-stone-200 text-sm focus:outline-none focus:border-amber-700 transition" />
      </div>

      <!-- Photo Buttons -->
      <div class="grid grid-cols-2 gap-3 mb-3">
        <label class="cursor-pointer flex flex-col items-center justify-center gap-2 bg-stone-900 text-white p-4 rounded-2xl shadow-md active:scale-95 transition">
          <svg class="w-6 h-6 text-amber-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
          <span class="text-xs font-semibold">Take a Photo</span>
          <input type="file" accept="image/*" capture="environment" class="hidden" onchange="handleFiles(this)" />
        </label>

        <label class="cursor-pointer flex flex-col items-center justify-center gap-2 bg-white text-stone-900 border border-stone-200 p-4 rounded-2xl shadow-sm active:scale-95 transition">
          <svg class="w-6 h-6 text-amber-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
          <span class="text-xs font-semibold">From Gallery</span>
          <input type="file" accept="image/*" multiple class="hidden" onchange="handleFiles(this)" />
        </label>
      </div>

      <!-- Direct Video Drive Button -->
      <a id="videoDriveLink" href="#" target="_blank" rel="noopener noreferrer" class="w-full mb-5 flex items-center justify-center gap-2.5 bg-amber-100/80 hover:bg-amber-100 text-amber-950 border border-amber-300/80 py-3.5 px-4 rounded-2xl shadow-sm active:scale-95 transition">
        <svg class="w-5 h-5 text-amber-800 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
        <div class="text-left">
          <span class="text-xs font-bold block leading-tight">Upload Videos (max 1 min)</span>
          <span class="text-[10px] text-amber-800 block">Opens shared Google Drive video folder</span>
        </div>
      </a>

      <div id="previewContainer" class="hidden mb-5">
        <div class="flex items-center justify-between mb-2">
          <span id="photoCount" class="text-xs font-semibold text-stone-600">0 photos selected</span>
          <button type="button" onclick="clearPhotos()" class="text-xs text-red-600 font-medium">Clear all</button>
        </div>
        <div id="previewGrid" class="space-y-1.5"></div>
      </div>

      <div id="statusBox" class="hidden mb-4 p-3.5 rounded-xl text-xs font-medium text-center"></div>
    </div>

    <button type="button" id="uploadBtn" onclick="uploadAll()" disabled class="w-full py-4 rounded-2xl bg-amber-700 text-white font-bold text-sm shadow-lg disabled:opacity-40 disabled:cursor-not-allowed active:scale-95 transition">
      Send Photos to Album
    </button>
  </main>

  <div id="qrModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden items-center justify-center p-5">
    <div class="bg-white rounded-3xl max-w-xs w-full p-6 text-center shadow-2xl">
      <h3 class="serif text-2xl font-bold text-stone-900 mb-1">Scan to Share</h3>
      <p class="text-xs text-stone-500 mb-4">Print or show this QR code at Kasernen</p>
      <div id="qrcode" class="flex justify-center p-3 bg-stone-50 rounded-2xl mb-4 border border-stone-100"></div>
      <div class="flex gap-2">
        <button type="button" onclick="downloadQR()" class="flex-1 py-2.5 bg-stone-900 text-white text-xs font-semibold rounded-xl">Download PNG</button>
        <button type="button" onclick="closeQrModal()" class="py-2.5 px-4 bg-stone-100 text-stone-700 text-xs font-semibold rounded-xl">Close</button>
      </div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz-hahU-SAhGy7VUmHQ0asW6XWvn2vDx7WdLeEb-QfGo-lgU6wudso3qvOvMB-xci1y/exec';
    const VIDEO_FOLDER_URL = 'https://drive.google.com/drive/folders/1pY6dg7y1q0G17a2UAyKyDC0jRmo7MVY1';

    document.getElementById('videoDriveLink').href = VIDEO_FOLDER_URL;

    let selectedFiles = [];
    let isUploading = false;

    function handleFiles(input) {
      if (!input.files || input.files.length === 0) return;
      selectedFiles = [...selectedFiles, ...Array.from(input.files)];
      input.value = '';
      hideStatus();
      renderPreviews();
    }

    function clearPhotos() {
      if (isUploading) return;
      selectedFiles = [];
      renderPreviews();
      hideStatus();
    }

    function formatBytes(bytes) {
      if (!bytes) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }

    function renderPreviews() {
      const container = document.getElementById('previewContainer');
      const grid = document.getElementById('previewGrid');
      const count = document.getElementById('photoCount');
      const btn = document.getElementById('uploadBtn');

      grid.innerHTML = '';
      if (selectedFiles.length === 0) {
        container.classList.add('hidden');
        btn.disabled = true;
        return;
      }

      container.classList.remove('hidden');
      btn.disabled = false;
      count.textContent = `${selectedFiles.length} photo${selectedFiles.length > 1 ? 's' : ''} ready`;

      selectedFiles.forEach((file, index) => {
        const div = document.createElement('div');
        div.className = 'flex items-center justify-between px-3 py-2.5 bg-white rounded-xl border border-stone-200 text-xs';
        div.innerHTML = `
          <div class="flex items-center gap-2 truncate pr-2">
            <span class="px-1.5 py-0.5 text-[10px] font-bold rounded bg-stone-100 text-stone-700">PHOTO</span>
            <span class="truncate text-stone-800 font-medium">${file.name}</span>
            <span class="text-stone-400 shrink-0">(${formatBytes(file.size)})</span>
          </div>
          <button type="button" onclick="removePhoto(${index})" class="text-red-600 font-bold text-sm px-2 py-0.5">×</button>
        `;
        grid.appendChild(div);
      });
    }

    function removePhoto(index) {
      if (isUploading) return;
      selectedFiles.splice(index, 1);
      renderPreviews();
    }

    function optimizePhotoForFastUpload(file) {
      return new Promise((resolve) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        const fallbackTimer = setTimeout(() => {
          URL.revokeObjectURL(url);
          readRawBase64(file).then(resolve);
        }, 2500);

        img.onload = () => {
          clearTimeout(fallbackTimer);
          try {
            const canvas = document.createElement('canvas');
            const MAX_SIDE = 1440;
            let width = img.width;
            let height = img.height;

            if (width > MAX_SIDE || height > MAX_SIDE) {
              if (width > height) {
                height = Math.round((height * MAX_SIDE) / width);
                width = MAX_SIDE;
              } else {
                width = Math.round((width * MAX_SIDE) / height);
                height = MAX_SIDE;
              }
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            const dataUrl = canvas.toDataURL('image/jpeg', 0.80);
            URL.revokeObjectURL(url);
            resolve({ base64: dataUrl.split(',')[1], mimeType: 'image/jpeg', ext: 'jpg' });
          } catch (e) {
            URL.revokeObjectURL(url);
            readRawBase64(file).then(resolve);
          }
        };

        img.onerror = () => {
          clearTimeout(fallbackTimer);
          URL.revokeObjectURL(url);
          readRawBase64(file).then(resolve);
        };

        img.src = url;
      });
    }

    function readRawBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const ext = file.name.split('.').pop() || 'jpg';
          resolve({
            base64: reader.result.split(',')[1],
            mimeType: file.type || 'image/jpeg',
            ext: ext
          });
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function postPayload(payloadString) {
      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open('POST', SCRIPT_URL, true);
        xhr.setRequestHeader('Content-Type', 'text/plain;charset=utf-8');
        xhr.timeout = 17000;

        xhr.onload = () => resolve(true);
        xhr.onerror = () => resolve(true);
        xhr.ontimeout = () => reject(new Error('Timeout'));

        xhr.send(payloadString);
      });
    }

    async function uploadAll() {
      if (isUploading || selectedFiles.length === 0) return;

      isUploading = true;
      const btn = document.getElementById('uploadBtn');
      const guest = document.getElementById('guestName').value.trim().replace(/[^a-zA-Z0-9_-]/g, '_') || 'Guest';
      btn.disabled = true;
      btn.textContent = 'Starting upload...';
      hideStatus();

      let successCount = 0;

      for (let i = 0; i < selectedFiles.length; i++) {
        const file = selectedFiles[i];
        btn.textContent = `Sending ${i + 1} of ${selectedFiles.length}...`;

        try {
          const payload = await optimizePhotoForFastUpload(file);
          const filename = `${guest}_${Date.now()}_${i + 1}.${payload.ext}`;

          await postPayload(JSON.stringify({
            filename: filename,
            mimeType: payload.mimeType,
            base64: payload.base64
          }));

          successCount++;
        } catch (err) {
          console.error(err);
        }
      }

      isUploading = false;
      btn.textContent = 'Send Photos to Album';

      if (successCount > 0) {
        showStatus(`Done! ${successCount} photo${successCount > 1 ? 's' : ''} added to the album.`, 'bg-emerald-100 text-emerald-900');
        selectedFiles = [];
        renderPreviews();
      } else {
        showStatus(`Stopped after 17s. Check connection and tap Send again.`, 'bg-red-100 text-red-900');
        btn.disabled = false;
      }
    }

    function showStatus(msg, classes) {
      const box = document.getElementById('statusBox');
      box.className = `mb-4 p-3.5 rounded-xl text-xs font-semibold text-center ${classes}`;
      box.textContent = msg;
      box.classList.remove('hidden');
    }

    function hideStatus() {
      document.getElementById('statusBox').classList.add('hidden');
    }

    let qrGenerated = false;
    function openQrModal() {
      const modal = document.getElementById('qrModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      if (!qrGenerated) {
        new QRCode(document.getElementById('qrcode'), {
          text: window.location.href,
          width: 200,
          height: 200,
          colorDark: '#1c1917',
          colorLight: '#fafaf9'
        });
        qrGenerated = true;
      }
    }

    function closeQrModal() {
      const modal = document.getElementById('qrModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function downloadQR() {
      const img = document.querySelector('#qrcode img');
      if (!img) return;
      const link = document.createElement('a');
      link.download = 'FakeWedding_QR.png';
      link.href = img.src;
      link.click();
    }
  </script>
</body>
</html>
